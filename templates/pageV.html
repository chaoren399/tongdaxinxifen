<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>笔记</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=66" />
    <style>
        /* ===== 页面 V：笔记（单篇富文本文档编辑） ===== */
        body.page-v { background: #f3f4f6; }
        .page-v .container { max-width: 1360px; }

        /* 左目录 + 右编辑器 */
        .nv-layout {
            display: flex;
            gap: 14px;
            align-items: flex-start;
        }
        /* 目录：自动提取正文 H1 / H2，点击跳转定位 */
        .nv-toc {
            flex: 0 0 210px;
            position: sticky;
            top: 70px;
            box-sizing: border-box;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 10px;
            max-height: calc(100vh - 110px);
            overflow-y: auto;
        }
        .nv-toc-title {
            font-size: 12px;
            font-weight: 700;
            color: #9ca3af;
            margin-bottom: 6px;
        }
        .nv-toc-item {
            display: block;
            padding: 3px 6px;
            border-radius: 6px;
            font-size: 12px;
            color: #374151;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .nv-toc-item.is-h1 { font-weight: 600; }
        .nv-toc-item.is-h2 { padding-left: 20px; }
        .nv-toc-item:hover { background: #f3f4f6; }
        .nv-toc-hint { color: #d1d5db; font-size: 12px; padding: 3px 6px; }
        @media (max-width: 1000px) { .nv-toc { display: none; } }
        .nv-editor h1, .nv-editor h2 { scroll-margin-top: 80px; }

        .nv-main {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 14px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        .nv-title-input {
            width: 100%;
            box-sizing: border-box;
            padding: 6px 2px;
            font: inherit;
            font-size: 20px;
            font-weight: 700;
            color: #111827;
            border: none;
            border-bottom: 1px solid #f3f4f6;
        }
        .nv-title-input:focus { outline: none; border-bottom-color: #93c5fd; }

        /* 工具栏 */
        .nv-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #f3f4f6;
        }
        .nv-tool {
            min-width: 28px;
            height: 28px;
            padding: 0 8px;
            font: inherit;
            font-size: 13px;
            color: #374151;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 6px;
            cursor: pointer;
        }
        .nv-tool:hover { background: #f3f4f6; }
        .nv-sep { width: 1px; height: 18px; background: #e5e7eb; margin: 0 4px; }

        /* 正文编辑区 */
        .nv-editor {
            margin-top: 10px;
            padding: 10px 4px;
            font-size: 14px;
            line-height: 1.9;
            color: #1f2937;
            outline: none;
            overflow-y: auto;
            min-height: 55vh;
        }
        .nv-editor:empty::before {
            content: attr(data-placeholder);
            color: #d1d5db;
        }
        .nv-editor img {
            max-width: 100%;
            border-radius: 6px;
            transition: box-shadow 0.18s ease;
        }
        .nv-editor .nv-img-selected {
            box-shadow: 0 0 0 2px #fff, 0 0 0 4px #60a5fa,
                0 8px 20px rgba(37, 99, 235, 0.3);
        }
        /* 图片块：图片 + 下方插入时间（原子块，整体选中 / 剪切） */
        .nv-editor figure.nv-img-fig {
            margin: 8px 0;
        }
        .nv-editor figure.nv-img-fig figcaption {
            margin-bottom: 4px;
            font-size: 11px;
            color: #9ca3af;
            font-family: "SF Mono", Consolas, Monaco, monospace;
        }
        .nv-editor table { border-collapse: collapse; margin: 6px 0; }
        .nv-editor table td,
        .nv-editor table th {
            border: 1px solid #d1d5db;
            padding: 4px 8px;
            min-width: 40px;
        }
        .nv-editor blockquote {
            margin: 6px 0;
            padding: 4px 12px;
            border-left: 3px solid #93c5fd;
            color: #6b7280;
            background: #f9fafb;
        }
        .nv-editor h1, .nv-editor h2, .nv-editor h3 { line-height: 1.4; }
        .nv-editor ul, .nv-editor ol { padding-left: 24px; }
        .nv-editor hr { border: none; border-top: 1px solid #e5e7eb; margin: 10px 0; }

        /* 状态栏 */
        .nv-statusbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-top: 10px;
            border-top: 1px solid #f3f4f6;
            font-size: 12px;
            color: #6b7280;
        }
        .nv-status.is-unsaved { color: #dc2626; }
        .nv-status.is-saved { color: #16a34a; }
        .nv-save-btn {
            margin-left: auto;
            padding: 6px 18px;
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            background: #2563eb;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .nv-save-btn:hover { background: #1d4ed8; }
        .nv-save-btn:disabled { opacity: 0.6; cursor: default; }
        .nv-hint { color: #9ca3af; }

        /* 图片大图预览层 */
        .nv-img-mask {
            position: fixed;
            inset: 0;
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: rgba(15, 23, 42, 0.78);
            cursor: zoom-out;
        }
        .nv-img-mask img {
            max-width: 90vw;
            max-height: 80vh;
            border-radius: 8px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
        }
        .nv-img-mask .nv-img-tip { color: #cbd5e1; font-size: 12px; }
        .nv-img-mask .nv-img-del {
            padding: 6px 16px;
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            background: #dc2626;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .nv-img-mask .nv-img-del:hover { background: #b91c1c; }
        .nv-img-mask .nv-img-crop {
            padding: 6px 16px;
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            background: #2563eb;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .nv-img-mask .nv-img-crop:hover { background: #1d4ed8; }

        /* 图片裁剪弹窗 */
        .nv-crop-mask {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: rgba(15, 23, 42, 0.88);
        }
        .nv-crop-wrap { position: relative; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5); }
        .nv-crop-wrap canvas { display: block; }
        .nv-crop-sel {
            position: absolute;
            border: 1px dashed #fff;
            box-shadow: 0 0 0 9999px rgba(15, 23, 42, 0.55);
            cursor: move;
        }
        .nv-crop-handle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #fff;
            border: 1px solid #2563eb;
            border-radius: 2px;
        }
        .nv-crop-h-n  { top: -5px;    left: calc(50% - 5px); cursor: ns-resize; }
        .nv-crop-h-s  { bottom: -5px; left: calc(50% - 5px); cursor: ns-resize; }
        .nv-crop-h-w  { left: -5px;   top: calc(50% - 5px); cursor: ew-resize; }
        .nv-crop-h-e  { right: -5px;  top: calc(50% - 5px); cursor: ew-resize; }
        .nv-crop-h-ne { top: -5px;    right: -5px; cursor: nesw-resize; }
        .nv-crop-h-nw { top: -5px;    left: -5px;  cursor: nwse-resize; }
        .nv-crop-h-se { bottom: -5px; right: -5px; cursor: nwse-resize; }
        .nv-crop-h-sw { bottom: -5px; left: -5px;  cursor: nesw-resize; }
        .nv-crop-tip { color: #cbd5e1; font-size: 12px; }
        .nv-crop-actions { display: flex; gap: 10px; }
        .nv-crop-actions button {
            padding: 6px 18px;
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .nv-crop-ok { background: #2563eb; }
        .nv-crop-ok:hover { background: #1d4ed8; }
        .nv-crop-cancel { background: #6b7280; }
        .nv-crop-cancel:hover { background: #4b5563; }
    </style>
</head>
<body class="page-v">
    <header class="topbar topbar-pageF">
        <nav class="topnav">
            <a href="{{ url_for('index') }}">首页</a>
            <a href="{{ url_for('page_a') }}">页面 A</a>
            <a href="{{ url_for('page_b') }}">页面 B</a>
            <a href="{{ url_for('page_d') }}">三级</a>
            <a href="{{ url_for('page_k') }}">概念</a>
            <a href="{{ url_for('page_l') }}">页面 L</a>
            <a href="{{ url_for('page_p') }}">页面 P</a>
            <a href="{{ url_for('page_r') }}" target="_blank" rel="noopener">周期</a>
            <a href="{{ url_for('page_s') }}">页面 S</a>
            <a href="{{ url_for('page_t') }}">页面 T</a>
            <a href="{{ url_for('page_u') }}">复盘</a>
            <a class="active" href="{{ url_for('page_v') }}">笔记</a>
        </nav>
    </header>

    <main class="container">
        <div class="nv-layout">
            <!-- ===== 左侧：目录（自动提取正文 H1 / H2） ===== -->
            <aside class="nv-toc">
                <div class="nv-toc-title">目 录</div>
                <div id="nvTocList">
                    <span class="nv-toc-hint">加载中…</span>
                </div>
            </aside>

            <section class="nv-main">
            <input type="text" class="nv-title-input" id="nvTitleInput" placeholder="输入标题…" />
            <div class="nv-toolbar" id="nvToolbar">
                <button type="button" class="nv-tool" data-cmd="undo" title="撤销">↶</button>
                <button type="button" class="nv-tool" data-cmd="redo" title="重做">↷</button>
                <span class="nv-sep"></span>
                <button type="button" class="nv-tool" data-block="h1" title="标题 1">H1</button>
                <button type="button" class="nv-tool" data-block="h2" title="标题 2">H2</button>
                <button type="button" class="nv-tool" data-block="h3" title="标题 3">H3</button>
                <button type="button" class="nv-tool" data-block="p" title="正文">正文</button>
                <span class="nv-sep"></span>
                <button type="button" class="nv-tool" data-cmd="bold" title="加粗"><b>B</b></button>
                <button type="button" class="nv-tool" data-cmd="italic" title="斜体"><i>I</i></button>
                <button type="button" class="nv-tool" data-cmd="underline" title="下划线"><u>U</u></button>
                <button type="button" class="nv-tool" data-cmd="strikeThrough" title="删除线"><s>S</s></button>
                <span class="nv-sep"></span>
                <button type="button" class="nv-tool" data-cmd="insertUnorderedList" title="无序列表">• 列表</button>
                <button type="button" class="nv-tool" data-cmd="insertOrderedList" title="有序列表">1. 列表</button>
                <button type="button" class="nv-tool" data-block="blockquote" title="引用">引用</button>
                <span class="nv-sep"></span>
                <button type="button" class="nv-tool" data-cmd="insertHorizontalRule" title="分割线">—</button>
                <button type="button" class="nv-tool" data-insert-table title="插入 3×3 表格">表格</button>
                <span class="nv-sep"></span>
                <button type="button" class="nv-tool" data-cmd="removeFormat" title="清除格式">清除</button>
                <button type="button" class="nv-tool" id="nvImgBtn" title="插入图片">图片</button>
                <input type="file" id="nvImgInput" accept="image/*" multiple hidden />
            </div>
            <div class="nv-editor" id="nvEditor" contenteditable="true"
                 data-placeholder="正文…（Ctrl+V 粘贴截图；单击图片选中后可 Ctrl+X 剪切，双击图片可裁剪/删除；Ctrl+S 保存）"></div>
            <div class="nv-statusbar">
                <span id="nvCharCount">0 字</span>
                <span class="nv-status" id="nvSaveStatus">加载中…</span>
                <span class="nv-hint">Ctrl+S 保存 · 停止输入约 3 秒后自动保存</span>
                <button type="button" class="nv-save-btn" id="nvSaveBtn">保 存</button>
            </div>
        </section>
        </div>
    </main>

    <script>
    (function () {
        "use strict";

        var $ = function (id) { return document.getElementById(id); };
        var titleEl = $("nvTitleInput");
        var editorEl = $("nvEditor");
        var charEl = $("nvCharCount");
        var statusEl = $("nvSaveStatus");
        var saveBtn = $("nvSaveBtn");
        var imgInput = $("nvImgInput");

        var dirty = false;         // 有未保存更改
        var saving = false;
        var autoTimer = null;

        function apiGet(url) {
            return fetch(url).then(function (r) {
                return r.json().then(function (body) {
                    return { status: r.status, body: body };
                });
            });
        }
        function apiPost(url, payload) {
            return fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload || {}),
            }).then(function (r) {
                return r.json().then(function (body) {
                    return { status: r.status, body: body };
                });
            });
        }

        function fmtTime(s) {
            // 'YYYY-MM-DD HH:MM:SS' -> 'MM-DD HH:MM'
            return String(s || "").slice(5, 16);
        }

        // ---- 字数 ----
        function updateCharCount() {
            var text = (editorEl.innerText || "").replace(/\n/g, "").length;
            charEl.textContent = text + " 字";
        }

        // ---- 保存状态提示 ----
        function setStatus(text, cls) {
            statusEl.textContent = text;
            statusEl.className = "nv-status" + (cls ? " " + cls : "");
        }

        // ---- 加载唯一笔记 ----
        function loadNote() {
            apiGet("/api/pageV/note")
                .then(function (resp) {
                    var j = resp.body || {};
                    if (!j.ok) { setStatus(j.error || "加载失败", "is-unsaved"); return; }
                    titleEl.value = j.note.title || "";
                    editorEl.innerHTML = j.note.content || "";
                    dirty = false;
                    updateCharCount();
                    refreshToc();
                    setStatus("上次更新 " + fmtTime(j.note.updated_at), "");
                })
                .catch(function () {
                    setStatus("加载失败", "is-unsaved");
                });
        }

        // ---- 保存 ----
        function collectContent() {
            var html = editorEl.innerHTML || "";
            if (!editorEl.textContent.trim() && !html.match(/<img|<table|<hr/i)) return "";
            return html;
        }

        function save() {
            if (saving) return Promise.resolve();
            saving = true;
            saveBtn.disabled = true;
            setStatus("保存中…", "");
            return apiPost("/api/pageV/save", {
                title: titleEl.value.trim(),
                content: collectContent(),
            }).then(function (resp) {
                var j = resp.body || {};
                if (!j.ok) { setStatus(j.error || "保存失败", "is-unsaved"); return; }
                dirty = false;
                var now = new Date();
                var hh = ("0" + now.getHours()).slice(-2);
                var mm = ("0" + now.getMinutes()).slice(-2);
                setStatus("已保存 " + hh + ":" + mm, "is-saved");
            }).catch(function () {
                setStatus("保存失败（网络错误）", "is-unsaved");
            }).then(function () {
                saving = false;
                saveBtn.disabled = false;
                if (dirty) setStatus("有未保存的更改", "is-unsaved");
            });
        }

        // ---- 修改标记 / 自动保存 ----
        function markDirty() {
            dirty = true;
            setStatus("有未保存的更改", "is-unsaved");
            if (autoTimer) clearTimeout(autoTimer);
            autoTimer = setTimeout(function () {
                if (dirty && !saving) save();
            }, 3000);
        }

        editorEl.addEventListener("input", function () {
            updateCharCount();
            markDirty();
            scheduleToc();
            clearImgSelection();
        });
        titleEl.addEventListener("input", markDirty);

        // ---- 左侧目录：提取正文 H1 / H2，点击跳转定位 ----
        var tocListEl = $("nvTocList");
        var tocTimer = null;

        function scheduleToc() {
            if (tocTimer) clearTimeout(tocTimer);
            tocTimer = setTimeout(refreshToc, 400);
        }

        function refreshToc() {
            if (!tocListEl) return;
            tocListEl.innerHTML = "";
            var heads = editorEl.querySelectorAll("h1, h2");
            if (!heads.length) {
                var hint = document.createElement("span");
                hint.className = "nv-toc-hint";
                hint.textContent = "正文使用 H1 / H2 标题后，目录显示在这里";
                tocListEl.appendChild(hint);
                return;
            }
            Array.prototype.forEach.call(heads, function (h, i) {
                if (!h.id) h.id = "nv-h-" + i;
                var item = document.createElement("div");
                item.className = "nv-toc-item " +
                    (h.tagName === "H1" ? "is-h1" : "is-h2");
                item.textContent = (h.innerText || "").trim() || "（无标题）";
                item.title = item.textContent;
                item.addEventListener("click", function () {
                    h.scrollIntoView({ behavior: "smooth", block: "start" });
                    // 短暂高亮定位到的标题
                    h.style.boxShadow = "0 0 0 3px #bfdbfe";
                    h.style.borderRadius = "4px";
                    setTimeout(function () { h.style.boxShadow = ""; }, 1200);
                });
                tocListEl.appendChild(item);
            });
        }

        // ---- 工具栏 ----
        $("nvToolbar").addEventListener("mousedown", function (ev) {
            var btn = ev.target.closest(".nv-tool");
            if (btn) ev.preventDefault();   // 防止编辑器失焦丢选区
        });
        $("nvToolbar").addEventListener("click", function (ev) {
            var btn = ev.target.closest(".nv-tool");
            if (!btn) return;
            editorEl.focus();
            if (btn.dataset.cmd) {
                document.execCommand(btn.dataset.cmd, false, null);
            } else if (btn.dataset.block) {
                document.execCommand("formatBlock", false, btn.dataset.block);
            } else if (btn.hasAttribute("data-insert-table")) {
                insertTable();
            }
            updateCharCount();
            markDirty();
        });

        function insertTable() {
            var html = '<table><tbody>';
            for (var r = 0; r < 3; r++) {
                html += "<tr>";
                for (var c = 0; c < 3; c++) html += "<td>&nbsp;</td>";
                html += "</tr>";
            }
            html += "</tbody></table><p><br></p>";
            document.execCommand("insertHTML", false, html);
        }

        // ---- 图片：选择文件 / Ctrl+V 粘贴 ----
        function uploadImageFile(file) {
            var fd = new FormData();
            fd.append("file", file);
            return fetch("/api/pageV/upload_image", { method: "POST", body: fd })
                .then(function (r) { return r.json(); })
                .then(function (j) {
                    if (!j.ok) throw new Error(j.error || "上传失败");
                    return j.url;
                });
        }

        function nowLabel() {
            var d = new Date();
            var p = function (n) { return ("0" + n).slice(-2); };
            return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate())
                + " " + p(d.getHours()) + ":" + p(d.getMinutes());
        }

        function insertImage(url) {
            var label = nowLabel();
            document.execCommand("insertHTML", false,
                '<figure class="nv-img-fig" contenteditable="false">'
                + '<figcaption>' + label + '</figcaption>'
                + '<img src="' + url + '" alt="笔记图片（' + label + '）" />'
                + "</figure><p><br></p>");
        }

        // ---- 双击正文图片：大图预览（裁剪 / 删除），点击空白 / Esc 关闭 ----
        // 单击：显式构造选区选中图片（蓝色高亮框），随后可用 Ctrl+X 剪切 / Ctrl+C 复制 / Delete 删除
        var imgMask = null;
        var clickedImg = null;

        function clearImgSelection() {
            editorEl.querySelectorAll(".nv-img-selected")
                .forEach(function (el) { el.classList.remove("nv-img-selected"); });
        }

        function selectImage(img) {
            clearImgSelection();
            // 图片 + 时间标注是原子块（figure）：整体选中，剪切时一起带走
            var target = img.closest("figure") || img;
            target.classList.add("nv-img-selected");
            var range = document.createRange();
            range.selectNode(target);
            var sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
        }

        editorEl.addEventListener("click", function (ev) {
            var img = ev.target.closest("img");
            if (img) {
                selectImage(img);
            } else {
                clearImgSelection();
            }
        });

        editorEl.addEventListener("dblclick", function (ev) {
            var img = ev.target.closest("img");
            if (!img) return;
            ev.preventDefault();
            clickedImg = img;
            showImgMask(img.getAttribute("src") || "");
        });

        function showImgMask(src) {
            closeImgMask();
            imgMask = document.createElement("div");
            imgMask.className = "nv-img-mask";
            var big = document.createElement("img");
            big.src = src;
            big.alt = "";
            var del = document.createElement("button");
            del.type = "button";
            del.className = "nv-img-del";
            del.textContent = "删除这张图片";
            var crop = document.createElement("button");
            crop.type = "button";
            crop.className = "nv-img-crop";
            crop.textContent = "裁剪这张图片";
            var tip = document.createElement("span");
            tip.className = "nv-img-tip";
            tip.textContent = "点击空白处或按 Esc 关闭";
            imgMask.appendChild(big);
            imgMask.appendChild(crop);
            imgMask.appendChild(del);
            imgMask.appendChild(tip);
            imgMask.addEventListener("click", function (ev) {
                if (ev.target === del || del.contains(ev.target)) return;
                if (ev.target === crop || crop.contains(ev.target)) return;
                closeImgMask();
            });
            del.addEventListener("click", function () {
                if (clickedImg && clickedImg.parentNode) {
                    var target = clickedImg.closest("figure") || clickedImg;
                    target.remove();
                    updateCharCount();
                    markDirty();
                }
                closeImgMask();
            });
            crop.addEventListener("click", function () {
                var src2 = big.src;
                var target = clickedImg;
                closeImgMask();
                openCrop(src2, target);
            });
            document.body.appendChild(imgMask);
        }

        function closeImgMask() {
            if (imgMask) {
                imgMask.remove();
                imgMask = null;
            }
        }

        // ---- 图片裁剪：拖动选框调整范围，确认后上传裁剪结果并替换原图 ----
        var cropMask = null;

        function openCrop(src, imgEl) {
            var image = new Image();
            image.onload = function () { buildCropUI(image, imgEl); };
            image.onerror = function () { setStatus("图片加载失败", "is-unsaved"); };
            image.src = src;
        }

        function closeCrop() {
            if (cropMask) {
                cropMask.remove();
                cropMask = null;
            }
        }

        function buildCropUI(image, imgEl) {
            closeCrop();
            var MIN = 20;   // 选框最小边长（屏幕像素）

            var mask = document.createElement("div");
            mask.className = "nv-crop-mask";
            var wrap = document.createElement("div");
            wrap.className = "nv-crop-wrap";

            var maxW = Math.min(window.innerWidth * 0.8, 1000);
            var maxH = window.innerHeight * 0.62;
            var scale = Math.min(maxW / image.width, maxH / image.height, 1);
            var W = Math.round(image.width * scale);
            var H = Math.round(image.height * scale);

            var canvas = document.createElement("canvas");
            canvas.width = W;
            canvas.height = H;
            canvas.getContext("2d").drawImage(image, 0, 0, W, H);
            wrap.appendChild(canvas);

            var sel = document.createElement("div");
            sel.className = "nv-crop-sel";
            ["n", "s", "e", "w", "ne", "nw", "se", "sw"].forEach(function (d) {
                var h = document.createElement("div");
                h.className = "nv-crop-handle nv-crop-h-" + d;
                h.dataset.dir = d;
                sel.appendChild(h);
            });
            wrap.appendChild(sel);
            mask.appendChild(wrap);

            var tip = document.createElement("span");
            tip.className = "nv-crop-tip";
            tip.textContent = "拖动选框选择保留区域（边角可调整大小），按原图分辨率裁剪";
            mask.appendChild(tip);

            var actions = document.createElement("div");
            actions.className = "nv-crop-actions";
            var okBtn = document.createElement("button");
            okBtn.type = "button";
            okBtn.className = "nv-crop-ok";
            okBtn.textContent = "裁剪并替换";
            var cancelBtn = document.createElement("button");
            cancelBtn.type = "button";
            cancelBtn.className = "nv-crop-cancel";
            cancelBtn.textContent = "取消";
            actions.appendChild(okBtn);
            actions.appendChild(cancelBtn);
            mask.appendChild(actions);

            document.body.appendChild(mask);
            cropMask = mask;

            var rect = { x: W * 0.08, y: H * 0.08, w: W * 0.84, h: H * 0.84 };
            function renderSel() {
                sel.style.left = rect.x + "px";
                sel.style.top = rect.y + "px";
                sel.style.width = rect.w + "px";
                sel.style.height = rect.h + "px";
            }
            renderSel();

            var drag = null;
            function startDrag(mode, e) {
                e.preventDefault();
                e.stopPropagation();
                drag = { mode: mode, sx: e.clientX, sy: e.clientY,
                         r: { x: rect.x, y: rect.y, w: rect.w, h: rect.h } };
                document.addEventListener("mousemove", onMove);
                document.addEventListener("mouseup", onUp);
            }
            function onMove(e) {
                if (!drag) return;
                var dx = e.clientX - drag.sx;
                var dy = e.clientY - drag.sy;
                var r0 = drag.r;
                if (drag.mode === "move") {
                    rect.x = Math.min(W - r0.w, Math.max(0, r0.x + dx));
                    rect.y = Math.min(H - r0.h, Math.max(0, r0.y + dy));
                } else {
                    var l = r0.x, t = r0.y;
                    var r = r0.x + r0.w, b = r0.y + r0.h;
                    if (drag.mode.indexOf("w") !== -1) {
                        l = Math.min(r - MIN, Math.max(0, r0.x + dx));
                    }
                    if (drag.mode.indexOf("e") !== -1) {
                        r = Math.max(l + MIN, Math.min(W, r0.x + r0.w + dx));
                    }
                    if (drag.mode.indexOf("n") !== -1) {
                        t = Math.min(b - MIN, Math.max(0, r0.y + dy));
                    }
                    if (drag.mode.indexOf("s") !== -1) {
                        b = Math.max(t + MIN, Math.min(H, r0.y + r0.h + dy));
                    }
                    rect.x = l; rect.y = t;
                    rect.w = r - l; rect.h = b - t;
                }
                renderSel();
            }
            function onUp() {
                drag = null;
                document.removeEventListener("mousemove", onMove);
                document.removeEventListener("mouseup", onUp);
            }
            sel.addEventListener("mousedown", function (e) { startDrag("move", e); });
            Array.prototype.forEach.call(
                sel.querySelectorAll(".nv-crop-handle"),
                function (h) {
                    h.addEventListener("mousedown", function (e) {
                        startDrag(h.dataset.dir, e);
                    });
                }
            );

            cancelBtn.addEventListener("click", closeCrop);
            mask.addEventListener("click", function (ev) {
                if (ev.target === mask) closeCrop();
            });

            okBtn.addEventListener("click", function () {
                var ow = Math.round(rect.w / scale);
                var oh = Math.round(rect.h / scale);
                var out = document.createElement("canvas");
                out.width = ow;
                out.height = oh;
                out.getContext("2d").drawImage(
                    image,
                    rect.x / scale, rect.y / scale, rect.w / scale, rect.h / scale,
                    0, 0, ow, oh
                );
                out.toBlob(function (blob) {
                    if (!blob) {
                        setStatus("裁剪失败", "is-unsaved");
                        closeCrop();
                        return;
                    }
                    var file = new File([blob], "crop_" + Date.now() + ".png",
                        { type: "image/png" });
                    setStatus("裁剪图上传中…", "");
                    uploadImageFile(file).then(function (url) {
                        var label = nowLabel() + "（裁剪）";
                        var fig = document.createElement("figure");
                        fig.className = "nv-img-fig";
                        fig.setAttribute("contenteditable", "false");
                        var nimg = document.createElement("img");
                        nimg.src = url;
                        nimg.alt = "笔记图片（" + label + "）";
                        var cap = document.createElement("figcaption");
                        cap.textContent = label;
                        fig.appendChild(cap);
                        fig.appendChild(nimg);
                        var old = imgEl.closest("figure") || imgEl;
                        if (old.parentNode) old.replaceWith(fig);
                        clickedImg = nimg;
                        updateCharCount();
                        markDirty();
                        closeCrop();
                    }).catch(function (e2) {
                        setStatus(e2.message || "裁剪上传失败", "is-unsaved");
                        closeCrop();
                    });
                }, "image/png");
            });
        }

        $("nvImgBtn").addEventListener("click", function () { imgInput.click(); });
        imgInput.addEventListener("change", function () {
            Array.prototype.slice.call(imgInput.files || []).forEach(function (f) {
                uploadImageFile(f).then(insertImage)
                    .catch(function (e) { setStatus(e.message || "图片上传失败", "is-unsaved"); });
            });
            imgInput.value = "";
        });

        editorEl.addEventListener("paste", function (ev) {
            var items = (ev.clipboardData && ev.clipboardData.items) || [];
            for (var i = 0; i < items.length; i++) {
                var it = items[i];
                if (it.kind === "file" && it.type && it.type.indexOf("image") === 0) {
                    var blob = it.getAsFile();
                    if (!blob) continue;
                    ev.preventDefault();
                    var sub = (it.type.split("/")[1] || "png").replace("jpeg", "jpg");
                    var file = new File([blob], "paste_" + Date.now() + "." + sub,
                        { type: it.type });
                    setStatus("图片上传中…", "");
                    uploadImageFile(file).then(function (url) {
                        insertImage(url);
                        updateCharCount();
                        markDirty();
                    }).catch(function (e) {
                        setStatus(e.message || "图片上传失败", "is-unsaved");
                    });
                    break;
                }
            }
        });

        // ---- 快捷键 ----
        document.addEventListener("keydown", function (ev) {
            if (ev.key === "Escape") {
                if (cropMask) { closeCrop(); return; }
                if (imgMask) { closeImgMask(); return; }
            }
            if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "s") {
                ev.preventDefault();
                save();
            }
        });

        saveBtn.addEventListener("click", save);

        // ---- 启动 ----
        loadNote();
        updateCharCount();
    })();
    </script>
</body>
</html>
