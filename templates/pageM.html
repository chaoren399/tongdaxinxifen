<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>M · 搜索历史（最近 3 年）</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=35" />
    <link rel="stylesheet" href="{{ url_for('static', filename='pageM.css') }}?v=2" />
</head>
<body>
    <header class="topbar topbar-pageF">
        <nav class="topnav">
            <a href="{{ url_for('index') }}">首页</a>
            <a href="{{ url_for('page_a') }}">页面 A</a>
            <a href="{{ url_for('page_b') }}">页面 B</a>
            <a href="{{ url_for('page_d') }}">页面 D</a>
            <a href="{{ url_for('page_k') }}">页面 K</a>
            <a href="{{ url_for('page_l') }}">页面 L</a>
            <a href="{{ url_for('page_p') }}">页面 P</a>
        </nav>
    </header>

    <main class="pageM-main">
        <div class="pageM-head">
            <h1 class="pageM-title">最近 3 年的搜索记录</h1>
            <div class="pageM-stats" id="pageMStats">
                <span class="pageM-stat-item">总搜索 <b id="pageMTotal">-</b> 次</span>
                <span class="pageM-stat-item">覆盖 <b id="pageMDays">-</b> 天</span>
                <span class="pageM-stat-item">总命中 <b id="pageMHits">-</b> 只</span>
            </div>
            <a class="pageP-card pageP-card-inline" href="{{ url_for('page_e') }}">
                <div class="pageP-card-icon">E</div>
                <div class="pageP-card-body">
                    <p class="pageP-card-title">页面 E</p>
                    <p class="pageP-card-desc">点击进入页面 E（已从顶部导航移除）</p>
                </div>
                <div class="pageP-card-arrow">›</div>
            </a>
        </div>

        <div class="pageM-toolbar">
            <label class="pageM-field">
                <span>天数：</span>
                <select id="pageMDaysSelect">
                    <option value="7">最近 7 天</option>
                    <option value="30">最近 30 天</option>
                    <option value="90">最近 90 天</option>
                    <option value="365">最近 1 年</option>
                    <option value="1095" selected>最近 3 年</option>
                </select>
            </label>
            <label class="pageM-field">
                <input type="text" id="pageMFilterInput" placeholder="按关键词过滤（实时筛选）" />
            </label>
            <button type="button" id="pageMRefreshBtn" class="pageM-btn">刷 新</button>
        </div>

        <div id="pageMList" class="pageM-list">
            <div class="pageM-loading">加载中…</div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='pageM.js') }}?v=2"></script>
</body>
</html>
