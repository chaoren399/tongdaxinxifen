<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>通达信行业分类 - 页面 K · 编辑「{{ concept.name }}」</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=54" />
    <style>
        /* ===== 页面 K 编辑页：概念层级大表（沿用页面 H 表格风格）===== */
        .ket-head {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 10px;
            padding: 12px 14px 8px;
        }
        .ket-tip { font-size: 12px; color: #9ca3af; }

        /* 「显示删除」开关：控制所有概念旁的 ✕ 是否可见 */
        .ket-toggle-del {
            margin-left: auto;
            flex: none;
            font-size: 12px;
            line-height: 1;
            padding: 5px 12px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            background: #fff;
            color: #4b5563;
            cursor: pointer;
        }
        .ket-toggle-del:hover { background: #f3f4f6; }
        .ket-toggle-del.is-on {
            background: #fef2f2;
            border-color: #fecaca;
            color: #b91c1c;
        }
        .ket-toggle-del.is-on:hover { background: #fee2e2; }

        .concept-level-table.ket-table { table-layout: auto; }
        .concept-level-table.ket-table tbody tr:hover td { background-color: #f8fafc; }
        .concept-level-table.ket-table tbody tr:hover td.lvl-col { filter: brightness(0.98); }
        .ket-empty { text-align: center; color: #9ca3af; padding: 22px 12px !important; }
        .ket-err { text-align: center; color: #b91c1c; padding: 22px 12px !important; }

        /* 概念单元格：名称 + 悬浮操作 */
        .ket-cell { display: inline-flex; align-items: center; gap: 4px; }
        .ket-cell-name {
            border-bottom: 1px dashed transparent;
            cursor: text;
        }
        .ket-cell-name:hover { border-bottom-color: #93c5fd; color: #1d4ed8; }
        .ket-cell-acts { display: inline-flex; gap: 2px; margin-left: 2px; }
        .ket-btn {
            font-size: 10px;
            line-height: 1;
            padding: 1px 3px;
            border: 1px solid #e5e7eb;
            border-radius: 3px;
            background: #fff;
            color: #9ca3af;
            cursor: pointer;
        }
        .ket-btn:hover { background: #eff6ff; border-color: #93c5fd; color: #2563eb; }
        .ket-btn.is-del:hover { background: #fef2f2; border-color: #fecaca; color: #b91c1c; }
        .ket-input {
            font-size: 12px;
            padding: 3px 6px;
            border: 1px solid #93c5fd;
            border-radius: 4px;
            width: 120px;
            outline: none;
        }
        .ket-input:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.15); }

        /* 股票 / 操作列：一个概念的多个股票在同一行并列展示 */
        .concept-level-table.ket-table td.col-stock { white-space: normal; }
        .ket-stock-item {
            display: inline-flex;
            align-items: center;
            margin: 2px 14px 2px 0;
            white-space: nowrap;
        }
        .ket-stock-item a {
            color: #111827; text-decoration: none; font-weight: 500;
        }
        .ket-stock-item a:hover { color: #2563eb; text-decoration: underline; }
        /* 移除按钮默认隐藏，悬停该股票时才出现，保证"只显示股票名称"的观感 */
        .ket-stock-x {
            margin-left: 4px;
            padding: 0 3px;
            border: none;
            background: transparent;
            color: #b91c1c;
            font-size: 13px;
            line-height: 1;
            cursor: pointer;
            opacity: 0;
            transition: opacity .12s;
        }
        .ket-stock-item:hover .ket-stock-x { opacity: 1; }
        .ket-stock-x:hover { background: #fee2e2; border-radius: 3px; }

        /* 股票列行内的批量添加按钮 / 输入区 */
        .ket-stock-add {
            margin-left: 4px;
            padding: 0 5px;
            border: 1px dashed #93c5fd;
            border-radius: 4px;
            background: #fff;
            color: #2563eb;
            font-size: 12px;
            line-height: 18px;
            cursor: pointer;
            vertical-align: middle;
        }
        .ket-stock-add:hover { background: #eff6ff; border-style: solid; }

        /* ===== 批量添加股票弹窗 ===== */
        .ket-modal { width: min(520px, calc(100vw - 32px)); }
        .ket-modal-path {
            margin: -6px 0 12px;
            font-size: 12px;
            color: #6b7280;
            word-break: break-all;
        }
        .ket-modal textarea {
            width: 100%;
            box-sizing: border-box;
            font-size: 13px;
            line-height: 1.7;
            padding: 8px 10px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            resize: vertical;
            font-family: inherit;
        }
        .ket-modal textarea:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
        }
        /* ===== 输入联想（输入「北京」提示库内含北京的股票） ===== */
        .ket-input-wrap { position: relative; }
        .ket-suggest {
            position: absolute;
            left: 0;
            right: 0;
            top: 100%;
            margin-top: 4px;
            max-height: 220px;
            overflow-y: auto;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            box-shadow: 0 10px 26px rgba(15, 23, 42, 0.16);
            padding: 4px 0;
            z-index: 20;
        }
        .ket-suggest[hidden] { display: none; }
        .ket-suggest-item {
            display: flex;
            align-items: baseline;
            gap: 8px;
            padding: 6px 12px;
            font-size: 13px;
            color: #374151;
            cursor: pointer;
        }
        .ket-suggest-item.is-active { background: #eff6ff; }
        .ket-suggest-item b { color: #2563eb; font-weight: 700; }
        .ket-suggest-code {
            font-size: 11px;
            color: #9ca3af;
            font-family: "SF Mono", Consolas, Monaco, monospace;
        }
        .ket-suggest-tag { margin-left: auto; font-size: 11px; color: #9ca3af; }
        .ket-suggest-item.is-owned { color: #9ca3af; }
        .ket-suggest-empty { padding: 8px 12px; font-size: 12px; color: #9ca3af; }

        .ket-modal-hint {
            margin: 8px 0 0;
            font-size: 12px;
            color: #9ca3af;
        }
        .ket-placeholder { color: #d1d5db; }
        .concept-level-table.ket-table tr.ket-placeholder-row td { background: #fcfcfd; }
    </style>
</head>
<body>
    <header class="topbar topbar-pageF" hidden>
        <nav class="topnav">
            <a href="{{ url_for('index') }}">首页</a>
            <a href="{{ url_for('page_a') }}">页面 A</a>
            <a href="{{ url_for('page_b') }}">页面 B</a>
            <a href="{{ url_for('page_d') }}">页面 D</a>
            <a class="active" href="{{ url_for('page_k') }}">页面 K</a>
            <a href="{{ url_for('page_l') }}">页面 L</a>
            <a href="{{ url_for('page_p') }}">页面 P</a>
        </nav>
    </header>

    <main class="container">
        <div class="ke-head">
            <div class="ke-title">
                <span class="lvl-badge lvl-{{ concept.level }}">{{ concept.level }}级</span>
                <h2 id="keName">{{ concept.name }}</h2>
                <span class="ke-path">{{ concept.path }}</span>
            </div>
            <div class="ke-head-actions">
                <button class="btn-secondary" id="backBtn" type="button">← 返回页面 K</button>
            </div>
        </div>

        <!-- ===== 概念层级总览（页面 H 风格大表：概念层级 + 股票，可直接编辑）===== -->
        <div class="industry-group-card ke-card">
            <div class="ket-head">
                <span class="cs-title">概念层级总览（<span id="tblCount">0</span> 只股票）</span>
                <span class="ket-tip">点击概念名右侧的「＋」可在其下新增下一级概念（逐级往下建，最多五级）；点击概念名可重命名</span>
                <button class="ket-toggle-del" id="toggleDelBtn" type="button"
                        title="显示 / 隐藏所有概念旁的删除「✕」">显示删除</button>
            </div>

            <table class="concept-level-table ket-table">
                <thead id="tblHead"></thead>
                <tbody id="tblBody">
                    <tr><td class="ket-empty" colspan="99">加载中...</td></tr>
                </tbody>
            </table>

            <datalist id="csStockList" hidden></datalist>
        </div>

        <!-- ===== 基本信息 ===== -->
        <div class="industry-group-card ke-card">
            <h3 class="ke-card-title">基本信息</h3>
            <form id="baseForm" class="concept-add-form" autocomplete="off">
                <div class="field">
                    <label for="editParent">上级分类</label>
                    <select id="editParent"></select>
                </div>
                <div class="field">
                    <label for="editName">概念名称 <span class="req">*</span></label>
                    <input id="editName" type="text" required />
                </div>
                <div class="field">
                    <label for="editCode">概念编码（可选）</label>
                    <input id="editCode" type="text" placeholder="如 GN001，可留空" />
                </div>
                <div class="field">
                    <label for="editDesc">描述（可选）</label>
                    <input id="editDesc" type="text" />
                </div>
                <div class="field-submit">
                    <button type="submit" class="btn-primary" id="editSave">保存基本信息</button>
                </div>
            </form>
            <label class="modal-check ke-check">
                <input id="editSync" type="checkbox" checked />
                同步修改股票数据（把股票概念串中的旧名称替换为新名称）
            </label>
        </div>
    </main>

    <!-- ===== 批量添加股票弹窗 ===== -->
    <div class="modal-mask" id="ketStockModal" hidden>
        <div class="modal-box ket-modal">
            <h3>批量添加股票</h3>
            <p class="ket-modal-path" id="ketModalPath"></p>
            <div class="ket-input-wrap">
                <textarea id="ketModalInput" rows="6" placeholder="杉杉股份&#10;璞泰来&#10;贝特瑞"></textarea>
                <div class="ket-suggest" id="ketSuggest" hidden></div>
            </div>
            <p class="ket-modal-hint">
                每行一个股票名称，也可用逗号 / 顿号 / 分号分隔；输入时会自动联想，↑↓ 选择、Enter 补全；Ctrl + Enter 提交
            </p>
            <div class="modal-actions">
                <button class="btn-secondary" id="ketModalCancel" type="button">取消</button>
                <button class="btn-danger" id="ketModalOk" type="button">添加</button>
            </div>
        </div>
    </div>

    <script>
    var CONCEPTS = {{ concepts | tojson }};
    var EDIT_ID = {{ concept.id }};
    var EDIT_NAME = {{ concept.name | tojson }};
    var EDIT_DESC = {{ (concept.description or '') | tojson }};
    var EDIT_CODE = {{ (concept.code or '') | tojson }};
    (function () {
        // ---- API 封装 ----
        function api(url, body) {
            return fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            }).then(function (r) {
                return r.json().then(function (j) { return { status: r.status, body: j }; });
            });
        }

        // GET 请求（用于拉取最新概念树做局部刷新）
        function apiGet(url) {
            return fetch(url, { method: 'GET' }).then(function (r) {
                return r.json().then(function (j) { return { status: r.status, body: j }; });
            });
        }

        function toast(msg, ok) {
            var t = document.createElement('div');
            t.className = 'pagek-toast ' + (ok ? 'is-ok' : 'is-err');
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(function () { t.classList.add('show'); }, 10);
            setTimeout(function () {
                t.classList.remove('show');
                setTimeout(function () { t.remove(); }, 300);
            }, 2600);
        }

        // ---- 返回页面 K ----
        document.getElementById('backBtn').addEventListener('click', function () {
            window.location.href = '/pageK';
        });

        // ============ 基本信息 ============
        document.getElementById('editName').value = EDIT_NAME;
        document.getElementById('editCode').value = EDIT_CODE;
        document.getElementById('editDesc').value = EDIT_DESC;
        document.getElementById('editSync').checked = true;
        fillEditParent(EDIT_ID);

        // 「上级分类」下拉：排除自身及所有子孙（防环），且只允许 level < 5 的作为上级
        function fillEditParent(selfId) {
            var sel = document.getElementById('editParent');
            var banned = new Set([selfId]);
            var changed = true;
            while (changed) {
                changed = false;
                CONCEPTS.forEach(function (c) {
                    if (c.parent_id && banned.has(c.parent_id) && !banned.has(c.id)) {
                        banned.add(c.id);
                        changed = true;
                    }
                });
            }
            var cur = null;
            CONCEPTS.forEach(function (c) { if (c.id === selfId) cur = c.parent_id; });

            sel.innerHTML = '';
            var rootOpt = document.createElement('option');
            rootOpt.value = '';
            rootOpt.textContent = '（无 · 作为一级概念）';
            sel.appendChild(rootOpt);
            CONCEPTS.forEach(function (c) {
                if (c.level >= 3) return;
                if (banned.has(c.id)) return;
                var opt = document.createElement('option');
                opt.value = c.id;
                opt.textContent = c.path;
                if (cur !== null && cur !== undefined && cur === c.id) opt.selected = true;
                sel.appendChild(opt);
            });
        }

        document.getElementById('baseForm').addEventListener('submit', function (ev) {
            ev.preventDefault();
            var name = document.getElementById('editName').value.trim();
            var desc = document.getElementById('editDesc').value.trim();
            var code = document.getElementById('editCode').value.trim();
            var sync = document.getElementById('editSync').checked;
            if (!name) { toast('概念名称不能为空', false); return; }

            var parentSel = document.getElementById('editParent');
            var body = {
                id: EDIT_ID,
                name: name,
                description: desc,
                code: code,
                sync_stocks: sync,
                parent_id: parentSel.value === '' ? null : parseInt(parentSel.value, 10)
            };
            var btn = document.getElementById('editSave');
            btn.disabled = true;
            api('/api/pageK/update_concept', body)
                .then(function (resp) {
                    if (resp.body && resp.body.ok) {
                        var msg = '已更新概念「' + name + '」';
                        if (resp.body.synced_stocks > 0) {
                            msg += '，同步更新 ' + resp.body.synced_stocks + ' 只股票';
                        }
                        toast(msg, true);
                        setTimeout(function () { window.location.reload(); }, 900);
                    } else {
                        toast((resp.body && resp.body.error) || ('HTTP ' + resp.status), false);
                    }
                })
                .catch(function (e) { toast('请求失败：' + e, false); })
                .finally(function () { btn.disabled = false; });
        });

        // ============ 概念层级总览大表（页面 H 风格）============
        var MAX_CONCEPT_LEVEL = 5;
        var tblCount = document.getElementById('tblCount');
        var tblHead = document.getElementById('tblHead');
        var tblBody = document.getElementById('tblBody');
        var csStockList = document.getElementById('csStockList');
        var allStocksCache = null;

        // 删除「✕」默认隐藏，点击头部「显示删除」后才出现（避免误删）
        var showDelBtns = false;
        var toggleDelBtn = document.getElementById('toggleDelBtn');

        function applyDelBtnState() {
            tblBody.querySelectorAll('.ket-btn.is-del').forEach(function (b) {
                b.hidden = !showDelBtns;
            });
            if (toggleDelBtn) {
                toggleDelBtn.textContent = showDelBtns ? '隐藏删除' : '显示删除';
                toggleDelBtn.classList.toggle('is-on', showDelBtns);
            }
        }

        if (toggleDelBtn) {
            toggleDelBtn.addEventListener('click', function () {
                showDelBtns = !showDelBtns;
                applyDelBtnState();
            });
        }

        function el(tag, cls, text) {
            var n = document.createElement(tag);
            if (cls) n.className = cls;
            if (text !== undefined && text !== null) n.textContent = text;
            return n;
        }

        // 收集某概念的所有子孙（保持 CONCEPTS 原有的树形顺序）
        function collectDescendants(conceptId) {
            var byParent = {};
            CONCEPTS.forEach(function (c) {
                var p = (c.parent_id === null || c.parent_id === undefined)
                    ? 'null' : String(c.parent_id);
                (byParent[p] = byParent[p] || []).push(c);
            });
            var seen = {};
            var stack = [String(conceptId)];
            while (stack.length) {
                var pid = stack.pop();
                (byParent[pid] || []).forEach(function (c) {
                    if (seen[c.id]) return;
                    seen[c.id] = true;
                    stack.push(String(c.id));
                });
            }
            return CONCEPTS.filter(function (c) { return seen[c.id]; });
        }

        function findConcept(cid) {
            var hit = null;
            CONCEPTS.forEach(function (c) { if (c.id === cid) hit = c; });
            return hit;
        }

        // 概念树发生增删后：拉取最新概念，再重建表格
        function refreshConcepts(cb) {
            apiGet('/api/pageK/concepts')
                .then(function (resp) {
                    if (resp.body && resp.body.ok) {
                        CONCEPTS = resp.body.concepts || CONCEPTS;
                    }
                    if (cb) cb();
                })
                .catch(function () { if (cb) cb(); });
        }

        function renderTblError(msg) {
            tblBody.innerHTML = '';
            var tr0 = el('tr');
            var td0 = el('td', 'ket-err', msg);
            td0.colSpan = 99;
            tr0.appendChild(td0);
            tblBody.appendChild(tr0);
        }

        function loadTable() {
            tblBody.innerHTML = '';
            var tr = el('tr');
            var td = el('td', 'ket-empty', '加载中...');
            td.colSpan = 99;
            tr.appendChild(td);
            tblBody.appendChild(tr);

            apiGet('/api/pageK/edit_table?concept_id=' + EDIT_ID)
                .then(function (resp) {
                    var j = resp.body || {};
                    if (!j.ok) {
                        renderTblError(j.error || ('HTTP ' + resp.status));
                        return;
                    }
                    renderTable(j);
                })
                .catch(function (e) { renderTblError('请求失败：' + e); });
        }

        function renderTable(j) {
            tblCount.textContent = j.stock_count || 0;
            var depth = j.max_depth || 1;
            var base = (j.root && j.root.level) || 1;

            // 表头：N 级概念列 + 股票
            tblHead.innerHTML = '';
            var hr = el('tr');
            for (var d = 0; d < depth; d++) {
                hr.appendChild(el('th', '', (base + d) + ' 级概念'));
            }
            hr.appendChild(el('th', '', '股票'));
            tblHead.appendChild(hr);

            tblBody.innerHTML = '';
            var rows = j.rows || [];
            if (!rows.length) {
                var tr0 = el('tr');
                var td0 = el('td', 'ket-empty', '该概念下暂无股票，点击股票列的「＋」添加');
                td0.colSpan = depth + 1;
                tr0.appendChild(td0);
                tblBody.appendChild(tr0);
            }

            rows.forEach(function (row) {
                var tr = el('tr');
                var stocks = row.stocks || [];
                // 占位行：该概念暂时没有挂股票，仍然占一行，方便继续加下级 / 加股票
                if (!stocks.length) {
                    tr.className = 'ket-placeholder-row';
                }

                (row.cells || []).forEach(function (cell, idx) {
                    if (!cell) return;   // 已被上方行的 rowspan 覆盖
                    var td = el('td', 'lvl-col lvl-col-' + (idx + 1));
                    if (cell.empty || !cell.id) {
                        // 该行概念路径不足此层级：渲染空格子占位，保证列对齐
                        td.className += ' lvl-empty';
                    } else {
                        td.rowSpan = cell.span || 1;
                        buildConceptCell(td, cell);
                    }
                    tr.appendChild(td);
                });

                // 股票列：只显示股票名称，一个概念的多个股票在同一行并列展示
                var tdS = el('td', 'col-stock');
                if (!stocks.length) {
                    tdS.appendChild(el('span', 'ket-placeholder', '— 暂无股票'));
                } else {
                    stocks.forEach(function (st) {
                        var item = el('span', 'ket-stock-item');
                        var a = el('a', '', st.name);
                        a.href = '/?q=' + encodeURIComponent(st.name);
                        a.setAttribute('data-stock', st.name);
                        item.appendChild(a);

                        // 移除按钮：默认隐藏，鼠标悬停该股票时才出现
                        var x = el('button', 'ket-stock-x', '×');
                        x.type = 'button';
                        x.title = '从「' + st.concept_path + '」移除 ' + st.name;
                        x.addEventListener('click', function () {
                            if (!confirm('确定从概念「' + st.concept_path + '」移除股票「' + st.name + '」？')) return;
                            x.disabled = true;
                            api('/api/pageK/remove_stock_from_concept', { name: st.concept_name, stock: st.name })
                                .then(function (resp) {
                                    if (resp.body && resp.body.ok) {
                                        toast('已从「' + st.concept_path + '」移除 ' + st.name, true);
                                        loadTable();
                                    } else {
                                        toast((resp.body && resp.body.error) || ('HTTP ' + resp.status), false);
                                        x.disabled = false;
                                    }
                                })
                                .catch(function (e) { toast('请求失败：' + e, false); x.disabled = false; });
                        });
                        item.appendChild(x);
                        tdS.appendChild(item);
                    });
                }

                // 行内「＋」：打开弹窗批量添加股票到该概念
                var pc2 = row.concept || {};
                var plus = el('button', 'ket-stock-add', '＋');
                plus.type = 'button';
                plus.title = '批量添加到「' + (pc2.path || pc2.name || '') + '」';
                plus.addEventListener('click', function () {
                    openStockAddModal(pc2, row.stocks || []);
                });
                tdS.appendChild(plus);
                tr.appendChild(tdS);

                tblBody.appendChild(tr);
            });

            applyDelBtnState();
        }

        // ===== 概念单元格：重命名 / 新增子级 / 删除 =====
        function buildConceptCell(td, cell) {
            td.innerHTML = '';
            td.title = cell.path || cell.name;

            var wrap = el('span', 'ket-cell');
            var name = el('span', 'ket-cell-name', cell.name);
            name.title = '点击重命名「' + (cell.path || cell.name) + '」';
            name.addEventListener('click', function () { startRename(td, cell); });

            var acts = el('span', 'ket-cell-acts');

            var canAdd = (cell.level || 1) < MAX_CONCEPT_LEVEL;
            var addBtn = el('button', 'ket-btn', '＋');
            addBtn.type = 'button';
            addBtn.disabled = !canAdd;
            addBtn.title = canAdd
                ? ('在「' + cell.name + '」下新增 ' + ((cell.level || 1) + 1) + ' 级概念')
                : '已达五级，不能再加子级';
            addBtn.addEventListener('click', function () { startChildAdd(td, cell); });

            var delBtn = el('button', 'ket-btn is-del', '✕');
            delBtn.type = 'button';
            delBtn.hidden = !showDelBtns;   // 默认隐藏，点「显示删除」后才出现
            delBtn.title = '删除「' + (cell.path || cell.name) + '」及其所有下级';
            delBtn.addEventListener('click', function () {
                if (!confirm('确定删除分类「' + (cell.path || cell.name) + '」及其所有下级？')) return;
                delBtn.disabled = true;
                api('/api/pageK/delete_concept', { id: cell.id, sync_stocks: true })
                    .then(function (resp) {
                        if (resp.body && resp.body.ok) {
                            toast('已删除「' + (cell.path || cell.name) + '」', true);
                            if (cell.id === EDIT_ID) {
                                setTimeout(function () { window.location.href = '/pageK'; }, 700);
                                return;
                            }
                            refreshConcepts(loadTable);
                        } else {
                            toast((resp.body && resp.body.error) || ('HTTP ' + resp.status), false);
                            delBtn.disabled = false;
                        }
                    })
                    .catch(function (e) { toast('请求失败：' + e, false); delBtn.disabled = false; });
            });

            acts.appendChild(addBtn);
            acts.appendChild(delBtn);
            wrap.appendChild(name);
            wrap.appendChild(acts);
            td.appendChild(wrap);
        }

        function startRename(td, cell) {
            td.innerHTML = '';
            var input = el('input', 'ket-input');
            input.type = 'text';
            input.value = cell.name;
            input.placeholder = '新名称';
            var ok = el('button', 'ket-btn', '存');
            ok.type = 'button';
            var cancel = el('button', 'ket-btn', '取');
            cancel.type = 'button';

            function close() { loadTable(); }
            function save() {
                var nm = (input.value || '').trim();
                if (!nm) { toast('分类名称不能为空', false); return; }
                if (nm === cell.name) { close(); return; }
                ok.disabled = true;
                api('/api/pageK/update_concept', { id: cell.id, name: nm, sync_stocks: true })
                    .then(function (resp) {
                        if (resp.body && resp.body.ok) {
                            toast('已重命名为「' + nm + '」', true);
                            // 改名会影响本页标题/路径，整页刷新最稳妥
                            setTimeout(function () { window.location.reload(); }, 800);
                        } else {
                            toast((resp.body && resp.body.error) || ('HTTP ' + resp.status), false);
                            ok.disabled = false;
                        }
                    })
                    .catch(function (e) { toast('请求失败：' + e, false); ok.disabled = false; });
            }

            ok.addEventListener('click', save);
            cancel.addEventListener('click', close);
            input.addEventListener('keydown', function (ev) {
                if (ev.key === 'Enter') { ev.preventDefault(); save(); }
                if (ev.key === 'Escape') { ev.preventDefault(); close(); }
            });
            td.appendChild(input);
            td.appendChild(ok);
            td.appendChild(cancel);
            input.focus();
            input.select();
        }

        function startChildAdd(td, cell) {
            td.innerHTML = '';
            var input = el('input', 'ket-input');
            input.type = 'text';
            input.placeholder = '在「' + cell.name + '」下新增子级';
            var ok = el('button', 'ket-btn', '加');
            ok.type = 'button';
            var cancel = el('button', 'ket-btn', '取');
            cancel.type = 'button';

            function close() { loadTable(); }
            function save() {
                var nm = (input.value || '').trim();
                if (!nm) { toast('请输入子分类名称', false); return; }
                ok.disabled = true;
                api('/api/pageK/add_concept', { name: nm, description: '', parent_id: cell.id })
                    .then(function (resp) {
                        if (resp.body && resp.body.ok) {
                            toast('已在「' + cell.name + '」下新增「' + nm + '」', true);
                            refreshConcepts(loadTable);
                        } else {
                            toast((resp.body && resp.body.error) || ('HTTP ' + resp.status), false);
                            ok.disabled = false;
                        }
                    })
                    .catch(function (e) { toast('请求失败：' + e, false); ok.disabled = false; });
            }

            ok.addEventListener('click', save);
            cancel.addEventListener('click', close);
            input.addEventListener('keydown', function (ev) {
                if (ev.key === 'Enter') { ev.preventDefault(); save(); }
                if (ev.key === 'Escape') { ev.preventDefault(); close(); }
            });
            td.appendChild(input);
            td.appendChild(ok);
            td.appendChild(cancel);
            input.focus();
        }

        // ===== 批量添加股票弹窗 =====
        var ketModal = document.getElementById('ketStockModal');
        var ketModalPath = document.getElementById('ketModalPath');
        var ketModalInput = document.getElementById('ketModalInput');
        var ketModalOk = document.getElementById('ketModalOk');
        var ketModalCancel = document.getElementById('ketModalCancel');
        var ketSuggest = document.getElementById('ketSuggest');
        var ketModalConcept = null;

        // ===== 输入联想 =====
        var suggestItems = [];      // 当前候选 [{name, code, owned}]
        var suggestIndex = -1;      // 高亮项下标
        var ownedNames = null;      // 当前概念已有的股票名（用于标注「已拥有」）

        function currentTerm() {
            // 取光标前最后一个分隔符之后的片段，作为联想关键词
            var pos = ketModalInput.selectionStart || 0;
            var before = ketModalInput.value.slice(0, pos);
            var m = before.match(/[^,，、;；\n\r\t]*$/);
            var term = m ? m[0] : '';
            return { term: term, start: pos - term.length, end: pos };
        }

        function matchStocks(term, limit) {
            // 名称匹配优先于代码匹配，开头匹配优先于包含匹配；结果按库内顺序（添加顺序）
            var kw = (term || '').trim();
            if (!kw || !allStocksCache) return [];
            var lower = kw.toLowerCase();
            var starts = [];
            var contains = [];
            for (var i = 0; i < allStocksCache.length; i++) {
                var s = allStocksCache[i];
                var name = s.name || '';
                var code = (s.code || '').toString();
                var ni = name.indexOf(kw);
                var ci = code.toLowerCase().indexOf(lower);
                if (ni === 0) starts.push(s);
                else if (ci === 0 && code) starts.push(s);
                else if (ni > 0) contains.push(s);
                else if (ci > 0) contains.push(s);
                if (starts.length >= limit) break;
            }
            return starts.concat(contains).slice(0, limit);
        }

        function hideSuggest() {
            ketSuggest.hidden = true;
            suggestItems = [];
            suggestIndex = -1;
        }

        function renderSuggest(term) {
            ketSuggest.innerHTML = '';
            var list = matchStocks(term, 8);
            suggestItems = list.map(function (s) {
                return {
                    name: s.name || '',
                    code: s.code || '',
                    owned: !!ownedNames && ownedNames.indexOf(s.name) >= 0
                };
            });
            suggestIndex = suggestItems.length ? 0 : -1;

            if (!suggestItems.length) {
                var empty = el('div', 'ket-suggest-empty', '没有匹配的股票');
                ketSuggest.appendChild(empty);
                ketSuggest.hidden = false;
                return;
            }

            suggestItems.forEach(function (item, idx) {
                var row = el('div', 'ket-suggest-item');
                if (idx === suggestIndex) row.classList.add('is-active');
                if (item.owned) row.classList.add('is-owned');

                // 高亮命中片段（用 DOM 拼接，避免 innerHTML 注入）
                var nm = el('span', 'ket-suggest-name');
                var pos = item.name.indexOf(term);
                if (pos >= 0 && term) {
                    nm.appendChild(document.createTextNode(item.name.slice(0, pos)));
                    var b = document.createElement('b');
                    b.textContent = item.name.slice(pos, pos + term.length);
                    nm.appendChild(b);
                    nm.appendChild(document.createTextNode(item.name.slice(pos + term.length)));
                } else {
                    nm.textContent = item.name;
                }
                row.appendChild(nm);

                if (item.code) row.appendChild(el('span', 'ket-suggest-code', item.code));
                if (item.owned) row.appendChild(el('span', 'ket-suggest-tag', '已拥有'));

                row.addEventListener('mousedown', function (ev) {
                    ev.preventDefault();                 // 防止 textarea 先失焦
                    applySuggest(idx);
                });
                row.addEventListener('mouseenter', function () { setSuggestIndex(idx); });
                ketSuggest.appendChild(row);
            });
            ketSuggest.hidden = false;
        }

        function setSuggestIndex(idx) {
            suggestIndex = idx;
            var rows = ketSuggest.querySelectorAll('.ket-suggest-item');
            for (var i = 0; i < rows.length; i++) {
                rows[i].classList.toggle('is-active', i === idx);
            }
            var act = ketSuggest.querySelector('.ket-suggest-item.is-active');
            if (act && act.scrollIntoView) act.scrollIntoView({ block: 'nearest' });
        }

        function updateSuggest() {
            var t = currentTerm();
            if (!t.term.trim()) { hideSuggest(); return; }
            renderSuggest(t.term.trim());
        }

        function applySuggest(idx) {
            var item = suggestItems[idx];
            if (!item) return;
            var val = ketModalInput.value;
            var t = currentTerm();
            var kw = t.term.trim();
            var start = t.start + t.term.indexOf(kw);   // 跳过关键词前的空格
            var after = val.slice(start + kw.length);
            // 补全后自动换行，方便继续输入下一只（后面已有内容则不加）
            var sep = after === '' ? '\n' : '';
            var newVal = val.slice(0, start) + item.name + sep + after;
            ketModalInput.value = newVal;
            var caret = start + item.name.length + sep.length;
            ketModalInput.focus();
            ketModalInput.setSelectionRange(caret, caret);
            hideSuggest();
        }

        function openStockAddModal(concept, owned) {
            ketModalConcept = concept;
            ketModalPath.textContent = '将添加到概念：「' + (concept.path || concept.name) + '」';
            ketModalInput.value = '';
            ketModalOk.disabled = false;
            ownedNames = (owned || []).map(function (s) { return s.name; });
            hideSuggest();
            ketModal.hidden = false;
            ketModalInput.focus();
            loadAllStocks();            // 确保候选股票已加载
        }

        function closeStockAddModal() {
            ketModal.hidden = true;
            ketModalConcept = null;
            ownedNames = null;
            hideSuggest();
        }

        function submitStockAddModal() {
            var concept = ketModalConcept;
            if (!concept) return;
            var raw = (ketModalInput.value || '').trim();
            if (!raw) { toast('请输入股票名称', false); return; }
            var names = raw.split(/[,，、;；\n\r\t]+/)
                .map(function (s) { return s.trim(); })
                .filter(Boolean);
            if (!names.length) { toast('请输入股票名称', false); return; }

            ketModalOk.disabled = true;
            api('/api/pageK/add_stocks_to_concept', { name: concept.name, stocks: names })
                .then(function (resp) {
                    if (resp.body && resp.body.ok) {
                        var target = resp.body.target || concept.name;
                        var msg = '已添加 ' + resp.body.added.length + ' 只股票（概念记为「' + target + '」）';
                        if (resp.body.skipped.length) msg += '，跳过已拥有：' + resp.body.skipped.join('、');
                        if (resp.body.not_found.length) msg += '，未找到：' + resp.body.not_found.join('、');
                        toast(msg, resp.body.added.length > 0);
                        closeStockAddModal();
                        refreshConcepts(loadTable);
                    } else {
                        toast((resp.body && resp.body.error) || ('HTTP ' + resp.status), false);
                        ketModalOk.disabled = false;
                    }
                })
                .catch(function (e) {
                    toast('请求失败：' + e, false);
                    ketModalOk.disabled = false;
                });
        }

        ketModalOk.addEventListener('click', submitStockAddModal);
        ketModalCancel.addEventListener('click', closeStockAddModal);
        ketModal.addEventListener('click', function (ev) {
            if (ev.target === ketModal) closeStockAddModal();   // 点遮罩关闭
        });
        ketModalInput.addEventListener('input', updateSuggest);
        ketModalInput.addEventListener('click', updateSuggest);
        ketModalInput.addEventListener('blur', function () {
            // 延迟隐藏，避免 mousedown 选中时被抢先关掉
            setTimeout(hideSuggest, 120);
        });
        ketModalInput.addEventListener('keydown', function (ev) {
            var open = !ketSuggest.hidden && suggestItems.length > 0;

            if (open && (ev.key === 'ArrowDown' || ev.key === 'ArrowUp')) {
                ev.preventDefault();
                var step = ev.key === 'ArrowDown' ? 1 : -1;
                var next = (suggestIndex + step + suggestItems.length) % suggestItems.length;
                setSuggestIndex(next);
                return;
            }
            if (open && (ev.key === 'Enter' || ev.key === 'Tab')) {
                ev.preventDefault();
                applySuggest(suggestIndex);
                return;
            }
            if (!ketSuggest.hidden && ev.key === 'Escape') {
                ev.preventDefault();     // 先关联想，再按一次才关弹窗
                hideSuggest();
                return;
            }
            if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) {
                ev.preventDefault();
                submitStockAddModal();
            } else if (ev.key === 'Escape') {
                ev.preventDefault();
                closeStockAddModal();
            }
        });
        document.addEventListener('keydown', function (ev) {
            if (ev.key === 'Escape' && !ketModal.hidden) closeStockAddModal();
        });

        function loadAllStocks() {
            if (allStocksCache !== null) return;
            fetch('/api/pageK/all_stocks')
                .then(function (r) { return r.json(); })
                .then(function (j) {
                    if (!j.ok) return;
                    allStocksCache = j.stocks || [];
                    csStockList.innerHTML = '';
                    allStocksCache.forEach(function (s) {
                        var opt = document.createElement('option');
                        opt.value = s.name;
                        opt.label = s.code ? (s.name + '  (' + s.code + ')') : s.name;
                        csStockList.appendChild(opt);
                    });
                    if (!ketModal.hidden) updateSuggest();   // 加载完再补一次联想
                })
                .catch(function () { /* 静默失败 */ });
        }

        // ---- 启动 ----
        loadTable();
        loadAllStocks();
    })();
    </script>
    <script src="{{ url_for('static', filename='stock_tip.js') }}?v=1"></script>
