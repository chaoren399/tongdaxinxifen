<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>通达信行业分类 - 页面 F · 多股票搜索</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=58" />
</head>
<body>
    <header class="topbar topbar-pageF">
        <nav class="topnav">
            <a class="active" href="{{ url_for('index') }}">首页</a>
            <a href="{{ url_for('page_a') }}">页面 A</a>
            <a href="{{ url_for('page_b') }}">页面 B</a>
            <a href="{{ url_for('page_d') }}">页面 D</a>
            <a href="{{ url_for('page_k') }}">页面 K</a>
            <a href="{{ url_for('page_l') }}">页面 L</a>
            <a href="{{ url_for('page_p') }}">页面 P</a>
        </nav>
    </header>

    <main class="container">
        <div class="batch-search-box">
            <div class="batch-search-row">
                <div class="pf-search-input-wrap">
                    <input type="text" id="batchSearchInput" placeholder="输入股票名称/代码/概念/关键词" autocomplete="off" />
                    <div class="pf-suggest" id="batchSuggest" hidden></div>
                </div>
                <button id="batchSearchBtn" type="button">搜 索</button>
            </div>
            <div class="search-history-row" id="searchHistoryRow" hidden>
                <span class="search-history-label">最近搜索：</span>
                <div class="search-history-chips" id="searchHistoryChips"></div>
            </div>
        </div>

        <div id="batchResultList" class="batch-result-list">
            <div class="stock-detail-card stock-detail-empty">
                <p class="empty">输入关键词后点击"搜索"，每只股票将按页面 E 的格式展示在这里</p>
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='pageF.js') }}?v=50"></script>
    <script src="{{ url_for('static', filename='stock_tip.js') }}?v=1"></script>
</body>
</html>
