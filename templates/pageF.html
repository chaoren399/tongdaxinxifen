<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F · 多股票搜索</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=63" />
    <style>
        /* 首页默认以 120% 缩放打开 */
        html { zoom: 1.2; }
        /* 搜索框「输入的文字」加粗加黑并放大（占位提示保持默认灰色与字号） */
        #batchSearchInput {
            font-weight: 900;
            font-size: 18px;
            color: #000;
        }
        #batchSearchInput::placeholder {
            font-size: 14px;   /* 占位提示保持原字号 */
        }
        /* zoom 1.2 下修正弹窗最大高度：避免「保存/取消」按钮被推出可视区 */
        .batch-modal {
            max-height: calc((100vh - 48px) / 1.2);
        }
    </style>
</head>
<body>
    <header class="topbar topbar-pageF">
        <nav class="topnav">
            <a class="active" href="{{ url_for('index') }}">首页</a>
            <a href="{{ url_for('page_a') }}">页面 A</a>
            <a href="{{ url_for('page_b') }}">页面 B</a>
            <a href="{{ url_for('page_d') }}">页面 D</a>
            <a href="{{ url_for('page_k') }}">页面 K</a>
            <a href="{{ url_for('page_l') }}">页面 L</a>
            <a href="{{ url_for('page_p') }}">页面 P</a>
            <a href="{{ url_for('page_r') }}" target="_blank" rel="noopener">页面 R</a>
            <a href="{{ url_for('page_s') }}">页面 S</a>
            <a href="{{ url_for('page_t') }}">页面 T</a>
        </nav>
    </header>

    <main class="container pageF-container">
        <div class="batch-search-box">
            <div class="batch-search-row">
                <div class="pf-search-input-wrap">
                    <input type="text" id="batchSearchInput" placeholder="输入股票名称/代码/概念/关键词" autocomplete="off" ondblclick="this.select()" />
                    <div class="pf-suggest" id="batchSuggest" hidden></div>
                </div>
                <button id="batchSearchBtn" type="button">搜 索</button>
            </div>
        </div>

        <div class="search-history-row" id="searchHistoryRow" hidden>
            <span class="search-history-label">最近搜索：</span>
            <div class="search-history-chips" id="searchHistoryChips"></div>
        </div>

        <div id="batchResultList" class="batch-result-list">
            <div class="stock-detail-card stock-detail-empty">
                <p class="empty">输入关键词后点击"搜索"，每只股票将按页面 E 的格式展示在这里</p>
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='pageF.js') }}?v=54"></script>
    <script src="{{ url_for('static', filename='stock_tip.js') }}?v=1"></script>
</body>
</html>
